name: Monthly AppFolio Census

on:
  schedule:
    # 11:00 UTC on the 2nd of every month (10pm Sydney)
    - cron: "0 11 2 * *"
  workflow_dispatch:
    inputs:
      cc_indexes:
        description: "Common Crawl indexes to query (most recent N)"
        default: "30"
        required: false
      enum_budget_min:
        description: "Minutes to spend on enumeration before moving on to the poll"
        default: "120"
        required: false
      skip_enumerate:
        description: "Skip enumeration, poll only"
        type: boolean
        default: false
        required: false

concurrency:
  group: census
  cancel-in-progress: false

jobs:
  census:
    # A cancelled run must not commit a half-written log over a live one
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 340
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # No npm install needed: census scripts use only Node built-ins.

      - name: Enumerate subdomains (Common Crawl + Wayback + seeds)
        if: ${{ !inputs.skip_enumerate }}
        continue-on-error: true
        env:
          ENUM_BUDGET_MIN: "${{ inputs.enum_budget_min || '120' }}"
        run: node census/enumerate.js --cc "${{ inputs.cc_indexes || '30' }}"

      - name: Poll every subdomain
        if: always()
        run: node census/poll.js

      - name: Commit census CSVs
        if: ${{ !cancelled() }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add census/customers.csv census/listings_monthly.csv census/run_log.md
          if git diff --staged --quiet; then
            echo "No changes."
          else
            git commit -m "Monthly census $(date +%Y-%m-%d)"
            # Another run (or the weekly scrape) may have pushed meanwhile.
            # During a rebase "theirs" is the commit being replayed, i.e. this
            # run's data, which should win for the census files.
            for i in 1 2 3; do
              git pull --rebase -X theirs && git push && break
              git rebase --abort 2>/dev/null || true
              sleep 15
            done
          fi
